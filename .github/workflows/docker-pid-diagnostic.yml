name: Docker PID diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [published-harness]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cacheplane/dawnai
          ref: 147a3a0659717ae936d899abb40dc9b559280f55
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Assert exact runtime
        run: test "$(node --version)" = "v24.19.0" && test "$(npm --version)" = "11.17.0"
      - name: Run authority-free shared diagnosis
        run: node diagnostics/docker-pid.mjs '${{ matrix.lane }}'
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docker-pid-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/shared-diagnostic
          if-no-files-found: warn
          retention-days: 3
